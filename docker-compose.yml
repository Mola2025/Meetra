version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: meetra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meetra
      POSTGRES_PASSWORD: meetra123
      POSTGRES_DB: meetra
    ports:
      - "5432:5432"
    volumes:
      - meetra_pgdata:/var/lib/postgresql/data

volumes:
  meetra_pgdata:
